services:
  pos_api:
    build: .
    container_name: pos_backend
    environment:
      MODULE_NAME: main
      VARIABLE_NAME: app
      APP_NAME: Duka API
      BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://postgres:Mdan10532@my_postgres:5432/flask_shop
      SECRET_KEY: replace-with-a-long-random-string
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_MINUTES: 30
      REFRESH_TOKEN_DAYS: 7
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
    ports:
      - "8000:80"
    depends_on:
      my_postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - my_net

  vue-app:
    build:
      context: ../vue-app
    container_name: vue_app
    ports:
      - "8080:80"
    depends_on:
      - pos_api
    restart: unless-stopped
    networks:
      - my_net

  my_postgres:
    image: postgres:latest
    container_name: pos_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Mdan10532"
      POSTGRES_DB: flask_shop
    ports:
      - "5142:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flask_shop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - my_net

volumes:
  postgres_data:

networks:
  my_net:
    driver: bridge
